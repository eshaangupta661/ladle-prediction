services:
  api:
    build: .
    container_name: ladle_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ladle_user}:${POSTGRES_PASSWORD:-ladle_pass}@db:5432/${POSTGRES_DB:-ladle_db}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./src/models:/app/src/models   # mount model artifacts so retrain persists

  db:
    image: postgres:15-alpine
    container_name: ladle_db
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-ladle_db}
      POSTGRES_USER:     ${POSTGRES_USER:-ladle_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ladle_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
